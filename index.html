<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e3a2f"><title>FindEat — Primeurs locaux</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#fbfbf9;--green:#1e3a2f;--red:#d95a3f;--ink:#1c1c1e;--muted:#737373;--line:#e5e5e2;--shadow:0 8px 30px #0000000f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.98)}.top{height:80px;display:flex;align-items:center;gap:20px;padding:12px 3vw;background:#fbfbf9dc;border-bottom:1px solid var(--line);backdrop-filter:blur(20px);position:relative;z-index:10}.brand{display:flex;align-items:center;gap:10px;min-width:235px}.logo{width:43px;height:43px;display:grid;place-items:center;color:white;font-size:23px;border-radius:14px;background:var(--green)}.brand b{display:block;color:var(--green);font-size:21px}.brand small{color:var(--muted);font-size:11px}.searchbox{position:relative;flex:1;max-width:650px}.search{width:100%;height:46px;padding:0 16px 0 43px;border:1px solid var(--line);border-radius:16px;outline:0;background:white;box-shadow:var(--shadow)}.search:focus{box-shadow:0 0 0 4px #1e3a2f14}.magnify{position:absolute;left:16px;top:11px;font-size:21px;color:var(--green)}.suggestions{display:none;position:absolute;top:52px;left:0;right:0;padding:6px;background:#fffffff7;border:1px solid var(--line);border-radius:16px;box-shadow:0 15px 35px #0002}.suggestions.open{display:block}.suggestion{display:block;width:100%;padding:11px;text-align:left;border-radius:10px;background:transparent}.suggestion:hover{background:#eaf0ec}.locate{height:44px;padding:0 16px;color:white;border-radius:15px;background:var(--green)}.layout{height:calc(100vh - 80px);display:grid;grid-template-columns:1fr 1fr}#map{height:calc(100vh - 80px);min-height:350px}.panel{overflow:hidden;border-left:1px solid var(--line);background:#fbfbf9e8}.filters{position:sticky;top:0;padding:18px 22px 15px;background:#fbfbf9eb;border-bottom:1px solid var(--line);backdrop-filter:blur(20px);z-index:2}.filter-head{display:flex;justify-content:space-between}.filter-head b{color:var(--green)}.count{color:var(--muted);font-size:13px}.budget{display:flex;align-items:center;gap:12px;margin-top:14px}.budget label{min-width:90px;color:var(--muted);font-size:12px}.budget input{flex:1;accent-color:var(--red)}.budget strong{min-width:55px;color:var(--red);font-size:13px;text-align:right}.segments{display:flex;gap:3px;margin-top:13px;padding:3px;overflow:auto;border-radius:13px;background:#e7e7e3}.segment{flex:1;min-width:54px;padding:8px;color:#666;font-size:12px;border-radius:10px;background:transparent}.segment.active{color:var(--green);font-weight:700;background:white;box-shadow:0 2px 7px #0002}.cards{height:calc(100% - 160px);overflow:auto;padding:18px 22px}.card{display:grid;grid-template-columns:56px 1fr auto;gap:13px;margin-bottom:12px;padding:16px;cursor:pointer;border:1px solid transparent;border-radius:20px;background:white;box-shadow:var(--shadow);transition:.2s}.card:hover,.card.selected{border-color:#d95a3f66;box-shadow:0 12px 30px #1e3a2f21;transform:translateY(-2px)}.avatar{width:56px;height:56px;display:grid;place-items:center;font-size:27px;border-radius:17px;background:#e5eee8}.card h3{margin:2px 0 5px;font-size:16px}.meta{margin-bottom:8px;color:var(--muted);font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag,.arrival{padding:4px 8px;color:var(--green);font-size:10px;border-radius:8px;background:#eaf0ec}.price{color:var(--red);font-weight:800;white-space:nowrap}.details{grid-column:2/4;text-align:left;color:var(--green);font-size:12px;font-weight:700;background:none}.empty{padding:30px;color:var(--muted);text-align:center}.price-marker{min-width:58px;padding:7px 9px;color:var(--red);font-size:13px;font-weight:800;text-align:center;border:2px solid var(--red);border-radius:15px;background:white;box-shadow:0 5px 13px #0002}.price-marker.active{color:white;border-color:var(--green);background:var(--green);transform:scale(1.1)}.user-dot{width:18px;height:18px;border:4px solid white;border-radius:50%;background:#1683ff;box-shadow:0 0 0 9px #1683ff29;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 16px #1683ff08}}.modal-bg{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#0005;backdrop-filter:blur(8px)}.modal-bg.open{display:grid}.modal{position:relative;width:min(600px,100%);max-height:92vh;overflow:auto;padding:28px;border-radius:27px;background:var(--bg);box-shadow:0 25px 70px #0004}.close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;color:var(--green);font-size:20px;background:#e7eee9}.modal h2{margin:0 45px 6px 0;color:var(--green)}.subtitle{color:var(--muted);font-size:13px}.section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.section h4{margin:0 0 10px;color:var(--green)}.hours{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#555;font-size:13px}.hours b{color:var(--ink)}.arrivals{display:flex;flex-wrap:wrap;gap:7px}.arrival{padding:8px 11px;font-size:12px}@media(max-width:850px){body{overflow:auto}.top{height:auto;min-height:72px;flex-wrap:wrap;gap:10px;padding:10px 14px}.brand{min-width:0;flex:1}.brand small{display:none}.locate{width:43px;padding:0;font-size:0}.locate:first-letter{font-size:18px}.searchbox{order:3;flex-basis:100%}.layout{height:calc(100vh - 125px);display:flex;flex-direction:column}#map{height:49vh;min-height:290px;flex:0 0 49vh}.panel{height:51vh;flex:1;border:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #00000014}.filters{padding:14px 16px 12px}.cards{height:calc(100% - 153px);padding:14px 16px}.card{grid-template-columns:48px 1fr auto;padding:13px;gap:10px}.avatar{width:48px;height:48px;font-size:22px}.card h3{font-size:14px}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo">🍎</div><div><b>FindEat</b><small>Trouvez votre primeur en un clin d’œil !</small></div></div><div class="searchbox"><span class="magnify">⌕</span><input id="search" class="search" autocomplete="off" placeholder="Rechercher une ville en France…"><div id="suggestions" class="suggestions"></div></div><button id="locate" class="locate">⌖ <span>Me localiser</span></button></header>
<main class="layout"><div id="map"></div><section class="panel"><div class="filters"><div class="filter-head"><b>Producteurs autour de vous</b><span id="count" class="count"></span></div><div class="budget"><label>Budget maximum</label><input id="budget" type="range" min="10" max="100" value="45"><strong id="budgetValue">45 €</strong></div><div class="segments"><button class="segment active" data-radius="5">5 km</button><button class="segment" data-radius="10">10 km</button><button class="segment" data-radius="15">15 km</button><button class="segment" data-radius="20">20 km</button><button class="segment" data-radius="999">20+ km</button></div></div><div id="cards" class="cards"></div></section></main>
<div id="modalBg" class="modal-bg"><article class="modal"><button id="close" class="close">×</button><h2 id="modalTitle"></h2><div id="modalSubtitle" class="subtitle"></div><div class="section"><h4>Horaires de la semaine</h4><div id="hours" class="hours"></div></div><div class="section"><h4>Arrivages de la semaine</h4><div id="arrivals" class="arrivals"></div></div><div class="section"><h4>Contact</h4><a href="tel:+33142880000" style="color:#1e3a2f;font-weight:700">☎ 01 42 88 00 00</a></div></article></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
(()=>{const $=s=>document.querySelector(s), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let center={lat:46.5,lon:2.2,name:'France'},radius=5,budget=45,stores=[],markers=new Map(),userMarker;
const data=[['La Ferme de Gally',48.741,2.069,'Versailles',24,['Carottes','Pommes','Salades']],['Les Jardins de Rungis',48.746,2.352,'Rungis',32,['Primeur','Agrumes','Herbes']],['Le Potager Lyonnais',45.757,4.862,'Lyon',21,['Tomates','Courgettes','Basilic']],['La Source des Monts d’Or',45.831,4.798,'Limonest',29,['Poires','Miel','Courges']],['Les Vergers de Provence',43.37,5.42,'Marseille',27,['Pêches','Abricots','Melons']],['La Halle des Producteurs',43.285,5.385,'Marseille',35,['Légumes','Fromages','Olives']],['Ferme des Quatre Saisons',43.59,1.48,'Toulouse',19,['Poireaux','Radis','Épinards']],['Le Jardin du Lauragais',43.52,1.61,'Toulouse',26,['Pommes','Courges','Mâche']],['Les Maraîchers de Garonne',44.81,-.61,'Bordeaux',23,['Asperges','Tomates','Fraises']],['Au Marché des Capucins',44.833,-.574,'Bordeaux',31,['Bio','Primeur','Noix']],['La Ferme de l’Erdre',47.279,-1.55,'Nantes',22,['Mâche','Poireaux','Pommes']],['Le Jardin Nantais',47.24,-1.58,'Nantes',18,['Salades','Carottes','Navets']],['Les Paniers du Nord',50.66,3.08,'Lille',25,['Endives','Pommes','Chicons']],['Ferme du Mélantois',50.59,3.18,'Lille',20,['Courges','Poireaux','Œufs']],['Le Verger Alsacien',48.59,7.72,'Strasbourg',28,['Kiwis','Pommes','Choux']],['La Grange de la Bruche',48.56,7.62,'Strasbourg',23,['Miel','Navets','Poires']],['Les Jardins du Lez',43.62,3.91,'Montpellier',24,['Melons','Courgettes','Basilic']],['La Récolte Héraultaise',43.57,3.82,'Montpellier',30,['Olives','Figues','Tomates']],['Les Vergers de la Vilaine',48.09,-1.69,'Rennes',21,['Pommes','Poires','Salades']],['Le Potager Breton',48.14,-1.75,'Rennes',17,['Carottes','Choux','Poireaux']],['La Ferme du Grésivaudan',45.23,5.78,'Grenoble',26,['Noix','Pommes','Courges']],['Les Jardins Alpins',45.17,5.69,'Grenoble',33,['Miels','Blettes','Herbes']],['Le Potager des Ducs',47.31,5.05,'Dijon',22,['Cassis','Choux','Navets']],['Ferme de la Côte-d’Or',47.28,5.12,'Dijon',28,['Pommes','Courges','Miel']],['La Prairie Locale',48.87,2.28,'Paris',39,['Bio','Fraises','Herbes']]];
const map=L.map('map').setView([46.5,2.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const hav=(a,b,c,d)=>{let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,z=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 6371*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};const icon=s=>L.divIcon({className:'',html:`<div class="price-marker">${s.price} €</div>`,iconSize:[70,35],iconAnchor:[35,18]});const userIcon=()=>L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
function generated(){let names=['Ferme des Vergers','La Grange Locale',`Les Maraîchers de ${center.name}`,'Le Potager des Collines','La Récolte du Matin','Les Jardins du Terroir'],tags=[['Carottes','Pommes','Salades'],['Tomates','Courgettes','Basilic'],['Poireaux','Courges','Miel'],['Fraises','Radis','Épinards'],['Poires','Choux','Herbes']];return Array.from({length:5},(_,i)=>{let a=Math.random()*6.28,k=1+Math.random()*6;return [names[i],center.lat+k/111*Math.cos(a),center.lon+k/(111*Math.cos(center.lat*Math.PI/180))*Math.sin(a),center.name,15+Math.floor(Math.random()*31),tags[i%tags.length]]})}function visible(){let rows=data.filter(x=>hav(center.lat,center.lon,x[1],x[2])<=radius);if(!rows.length)rows=generated();return rows.map((x,i)=>({id:i+'-'+x[0],name:x[0],lat:x[1],lon:x[2],city:x[3],price:x[4],tags:x[5],distance:hav(center.lat,center.lon,x[1],x[2])})).filter(x=>x.price<=budget&& (radius===999||x.distance<=radius)).sort((a,b)=>a.distance-b.distance)}
function render(){stores=visible();markers.forEach(m=>map.removeLayer(m));markers.clear();stores.forEach(s=>{let m=L.marker([s.lat,s.lon],{icon:icon(s)}).addTo(map).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.city)} · ${s.distance.toFixed(1)} km<br><strong>${s.price} € en moyenne</strong>`);m.on('click',()=>select(s.id,true));markers.set(s.id,m)});$('#count').textContent=stores.length+' résultat'+(stores.length>1?'s':'');$('#cards').innerHTML=stores.length?stores.map(s=>`<article class="card" data-id="${esc(s.id)}"><div class="avatar">${s.tags.includes('Miel')?'🍯':s.tags.includes('Pommes')?'🍎':'🥕'}</div><div><h3>${esc(s.name)}</h3><div class="meta">${esc(s.city)} · ${s.distance.toFixed(1)} km</div><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="price">${s.price} €</div><button class="details">Voir les détails →</button></article>`).join(''):'<div class="empty">Aucun résultat. Augmentez le budget ou le rayon.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=e=>e.target.closest('.details')?open(c.dataset.id):select(c.dataset.id,false))}
function select(id,fromMap){let s=stores.find(x=>x.id===id),c=document.querySelector(`[data-id="${CSS.escape(id)}"]`),m=markers.get(id);if(!s)return;document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));c?.classList.add('selected');c?.scrollIntoView({behavior:'smooth',block:'center'});if(m){m.setIcon(icon(s));if(!fromMap)map.flyTo([s.lat,s.lon],Math.max(12,map.getZoom()),{duration:.8});setTimeout(()=>m.openPopup(),fromMap?0:650)}}
function open(id){let s=stores.find(x=>x.id===id);if(!s)return;$('#modalTitle').textContent=s.name;$('#modalSubtitle').textContent=`${s.city} · ${s.distance.toFixed(1)} km · panier moyen ${s.price} €`;$('#hours').innerHTML=[['Lundi','08:30 – 18:30'],['Mardi','08:30 – 18:30'],['Mercredi','08:30 – 18:30'],['Jeudi','08:30 – 19:00'],['Vendredi','08:30 – 19:00'],['Samedi','08:00 – 17:30'],['Dimanche','Fermé']].map(x=>`<div><b>${x[0]}</b><br>${x[1]}</div>`).join('');$('#arrivals').innerHTML=[...s.tags,'Paniers de saison','Produits locaux'].map(x=>`<span class="arrival">${esc(x)}</span>`).join('');$('#modalBg').classList.add('open')}function close(){ $('#modalBg').classList.remove('open')}
$('#budget').oninput=e=>{budget=+e.target.value;$('#budgetValue').textContent=budget+(budget===100?'+':'')+' €';render()};document.querySelectorAll('.segment').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segment').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=+b.dataset.radius;render()});$('#close').onclick=close;$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')close()};document.onkeydown=e=>{if(e.key==='Escape')close()};$('#locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{center={lat:p.coords.latitude,lon:p.coords.longitude,name:'Votre position'};if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([center.lat,center.lon],{icon:userIcon()}).addTo(map).bindPopup('Vous êtes ici');map.flyTo([center.lat,center.lon],12);render()},()=>alert('Géolocalisation indisponible.'));
let timer;$('#search').oninput=e=>{clearTimeout(timer);let q=e.target.value.trim();if(q.length<2)return $('#suggestions').classList.remove('open');timer=setTimeout(async()=>{try{let d=await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(q)+'&type=municipality&limit=5').then(r=>r.json());$('#suggestions').innerHTML=d.features.map(f=>{let [lon,lat]=f.geometry.coordinates;return `<button class="suggestion" data-lat="${lat}" data-lon="${lon}" data-name="${esc(f.properties.name||f.properties.label)}">📍 ${esc(f.properties.label)}</button>`}).join('')||'<div class="suggestion">Aucune commune</div>';$('#suggestions').classList.add('open');document.querySelectorAll('.suggestion[data-lat]').forEach(b=>b.onclick=()=>{center={lat:+b.dataset.lat,lon:+b.dataset.lon,name:b.dataset.name};$('#search').value=center.name;$('#suggestions').classList.remove('open');map.flyTo([center.lat,center.lon],12);render()})}catch{$('#suggestions').innerHTML='<div class="suggestion">Recherche indisponible.</div>';$('#suggestions').classList.add('open')}},180)};window.addEventListener('resize',()=>map.invalidateSize());render();setTimeout(()=>map.invalidateSize(),300)})();
</script></body></html>
