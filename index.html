<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FindEat — Vos primeurs locaux</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f2f7;--card:#fff;--surface:#ffffffe0;--green:#244c3c;--accent:#34c759;--light:#ebf4ee;--red:#d3543a;--ink:#1c1c1e;--muted:#8e8e93;--line:#3c3c431f;--shadow:0 8px 24px #00000014;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}button,input{font:inherit;border:0;outline:0}button{cursor:pointer}button:active{transform:scale(.97)}.topbar{height:72px;display:flex;align-items:center;gap:16px;padding:0 28px;background:var(--surface);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);position:relative;z-index:1000}.brand{display:flex;align-items:center;gap:12px;min-width:235px}.brand-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--green),#142e24);font-size:20px;box-shadow:0 4px 12px #244c3c40}.brand h1{font-size:19px;color:var(--green)}.brand p{font-size:11px;color:var(--muted)}.search-container{position:relative;flex:1;max-width:580px}.search-bar{width:100%;height:44px;padding:0 42px 0 44px;background:#7676801f;border-radius:12px;font-size:14px}.search-bar:focus{background:white;box-shadow:0 0 0 3px #244c3c26}.search-icon-left{position:absolute;left:14px;top:11px;color:var(--muted)}.locate-btn{height:42px;padding:0 16px;border-radius:12px;background:var(--green);color:#fff;font-size:13px;font-weight:600}.suggestions-menu{position:absolute;top:50px;left:0;right:0;display:none;padding:6px;background:#fffffff5;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px #244c3c20;z-index:1200}.suggestions-menu.show{display:block}.suggestion-item{display:flex;gap:12px;width:100%;padding:10px 14px;text-align:left;border-radius:10px;background:transparent}.suggestion-item:hover{background:var(--light)}.suggestion-item strong,.suggestion-item small{display:block}.suggestion-item small{color:var(--muted);font-size:11px}.app-body{height:calc(100vh - 72px);display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden}#map-wrapper,#map{width:100%;height:100%}.sidebar{height:100%;overflow:hidden;display:flex;flex-direction:column;border-left:1px solid var(--line)}.filter-shelf{padding:18px 22px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);flex-shrink:0}.shelf-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.shelf-header h2{font-size:17px}.badge-count{padding:3px 9px;border-radius:12px;color:var(--green);background:var(--light);font-size:12px;font-weight:600}.budget-labels{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;font-weight:600}.budget-labels span{color:var(--muted)}.budget-labels strong{color:var(--red);font-size:14px}input[type=range]{width:100%;accent-color:var(--green)}.segmented-control{display:flex;gap:2px;padding:2px;margin-top:16px;border-radius:10px;background:#e5e5ea}.segment-btn{flex:1;padding:7px 0;border-radius:8px;color:var(--muted);background:transparent;font-size:12px;font-weight:600}.segment-btn.active{color:var(--ink);background:#fff;box-shadow:0 2px 6px #0000001f}.cards-flow{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.store-card{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:15px;border:1.5px solid transparent;border-radius:18px;background:#fff;box-shadow:0 2px 8px #0000000a;transition:.2s}.store-card:hover,.store-card.active{border-color:var(--green);box-shadow:0 16px 40px #244c3c1f}.store-avatar{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#f9fbf9,#e3ece5);font-size:26px}.store-info h3{margin-bottom:2px;font-size:15px}.store-sub{display:flex;gap:6px;margin-bottom:8px;color:var(--muted);font-size:12px}.tag-row{display:flex;flex-wrap:wrap;gap:5px}.tag-pill{padding:3px 7px;border-radius:6px;color:var(--green);background:var(--light);font-size:10px;font-weight:600}.store-right{text-align:right}.price-tag{color:var(--red);font-size:14px;font-weight:800}.open-badge{margin-top:6px;color:var(--accent);font-size:10px;font-weight:700}.empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}.pin-pill{padding:5px 10px;border:1.5px solid #00000014;border-radius:14px;color:var(--ink);background:#fff;box-shadow:0 4px 12px #00000026;font-size:12px;font-weight:700;white-space:nowrap}.pin-pill.active{color:#fff;background:var(--green);border-color:var(--green);transform:scale(1.12)}.pin-user{width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:#07f;box-shadow:0 0 0 6px #007aff40}.modal-overlay{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#0000004d;backdrop-filter:blur(12px);z-index:2000}.modal-overlay.open{display:grid}.modal-sheet{position:relative;width:min(520px,100%);padding:24px;border-radius:24px;background:#fff;box-shadow:0 24px 60px #0003}.close-circle{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:#e5e5ea;color:var(--muted)}.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:16px 0;padding:14px;border-radius:12px;background:var(--bg);font-size:13px}.schedule-grid strong{color:var(--ink)}
@media(max-width:860px){body{height:100%;overflow:auto}.topbar{height:auto;min-height:72px;flex-wrap:wrap;padding:10px 16px}.brand{min-width:0;flex:1}.brand p{display:none}.locate-btn{width:43px;padding:0;font-size:0}.locate-btn:first-letter{font-size:18px}.search-container{order:3;flex-basis:100%}.app-body{height:calc(100vh - 125px);display:flex;flex-direction:column}.map-wrapper{height:44vh}.sidebar{height:56vh;border:0;border-radius:24px 24px 0 0}.filter-shelf{padding:14px 16px}.cards-flow{padding:14px 16px}.store-card{grid-template-columns:48px 1fr auto;padding:13px;gap:10px}.store-avatar{width:48px;height:48px;font-size:22px}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-icon">🍏</div><div><h1>FindEat</h1><p>Primeurs & producteurs de saison</p></div></div><div class="search-container"><span class="search-icon-left">🔍</span><input id="searchInput" class="search-bar" placeholder="Entrez une ville en France..." autocomplete="off"><div id="suggestionsMenu" class="suggestions-menu"></div></div><button id="locateBtn" class="locate-btn">📍 <span>Autour de moi</span></button></header>
<main class="app-body"><div id="map-wrapper"><div id="map"></div></div><aside class="sidebar"><div class="filter-shelf"><div class="shelf-header"><h2>Producteurs à proximité</h2><span id="resultsCount" class="badge-count">Chargement...</span></div><div class="budget-labels"><span>Panier moyen maximum</span><strong id="budgetValue">45 €</strong></div><input id="budgetSlider" type="range" min="10" max="100" value="45" step="5"><div class="segmented-control" id="radiusSelector"><button class="segment-btn active" data-radius="5">5 km</button><button class="segment-btn" data-radius="10">10 km</button><button class="segment-btn" data-radius="15">15 km</button><button class="segment-btn" data-radius="20">20 km</button><button class="segment-btn" data-radius="999">Tout</button></div></div><div id="cardsList" class="cards-flow"></div></aside></main>
<div id="modalOverlay" class="modal-overlay"><div class="modal-sheet"><button id="closeModalBtn" class="close-circle">✕</button><h2 id="modalName" style="color:var(--green);font-size:20px"></h2><p id="modalDistance" style="color:var(--muted);font-size:13px;margin-top:4px"></p><div style="font-size:13px;font-weight:600;margin-top:18px">Horaires d'ouverture</div><div class="schedule-grid"><div><strong>Lundi - Vendredi</strong></div><div>08:30 – 19:30</div><div><strong>Samedi</strong></div><div>08:00 – 18:00</div><div><strong>Dimanche</strong></div><div>09:00 – 12:30</div></div><div style="font-size:13px;font-weight:600;margin-bottom:8px">Arrivages de saison</div><div id="modalPills" class="tag-row" style="margin-bottom:20px"></div><a id="modalCall" href="#" style="display:block;text-align:center;padding:12px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;text-decoration:none">📞 Contacter le primeur</a></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{let userLocation={lat:46.6033,lon:1.8883,name:'France Métropolitaine'},currentRadius=5,currentMaxBudget=45,activeMarkers=new Map,activeStores=[],searchDebounce=null,userMarker=null;const stores=[['Le Potager de Saint-Cyr',48.801,2.062,'Versailles',28,['Pommes','Carottes bio','Fraises'],'🍎'],['La Ferme des Maraîchers',48.852,2.378,'Paris 11e',34,['Salades','Paniers','Agrumes'],'🥬'],['Verger des Buttes',48.882,2.381,'Paris 19e',29,['Poires','Miel','Courges'],'🍐'],['Au Maraîcher Lyonnais',45.764,4.835,'Lyon Presqu’île',22,['Tomates anciennes','Basilic','Pêches'],'🍅'],['Ferme du Mont d’Or',45.821,4.812,'Caluire',31,['Légumes racines','Œufs frais'],'🥕'],['Terre de Provence',43.296,5.378,'Marseille',25,['Melons','Courgettes','Figues'],'🍈'],['Les Oliviers de l’Estaque',43.361,5.312,'Marseille',38,['Olives','Herbes de Provence'],'🫒'],['La Récolte Toulousaine',43.604,1.444,'Toulouse Centre',24,['Mâche','Radis','Fraises bio'],'🍓'],['Jardins de Garonne',44.837,-.579,'Bordeaux Chartrons',26,['Asperges','Cèpes','Prunes'],'🍇'],["L'Arbre à Légumes",44.821,-.556,'Bordeaux Sud',19,['Paniers éco','Courges'],'🥦'],['Le Marais Fleuri',47.218,-1.553,'Nantes',23,['Mâche nantaise','Poireaux'],'🥬'],['Verger du Mélantois',50.629,3.057,'Lille',27,['Chicons','Pommes des Flandres'],'🍏'],['La Halte Maraîchère',48.573,7.752,'Strasbourg',30,['Choux','Mirabelles','Kiwis'],'🍑'],['Jardins Occitans',43.611,3.877,'Montpellier',25,['Herbes fraîches','Abricots'],'🌿'],['Potager Rennais',48.117,-1.677,'Rennes',20,['Fraises','Artichauts'],'🍓'],['Ferme du Dauphiné',45.188,5.724,'Grenoble',32,['Noix de Grenoble','Miels'],'🍯'],['La Cueillette Dijonnaise',47.322,5.041,'Dijon',26,['Cassis','Légumes d’antan'],'🍒'],['Les Vergers de la Méditerranée',43.703,7.266,'Nice',42,['Citrons de Menton','Blettes'],'🍋']];const map=L.map('map',{zoomControl:false}).setView([userLocation.lat,userLocation.lon],6);L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);const distance=(a,b,c,d)=>{let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,z=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 6371*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};function fallback(){let names=['La Ferme Locale','Le Panier Fermier','Le Potager Bio','Verger du Terroir','La Grange Fraîche'],tags=[['Fraises','Asperges','Miel'],['Tomates','Courgettes','Salades'],['Pommes','Poires','Jus artisanal'],['Légumes oubliés','Paniers bio']];return Array.from({length:5},(_,i)=>{let a=Math.random()*Math.PI*2,d=1.2+Math.random()*5.5;return{name:`${names[i]} de ${userLocation.name}`,lat:userLocation.lat+d/111*Math.cos(a),lon:userLocation.lon+d/(111*Math.cos(userLocation.lat*Math.PI/180))*Math.sin(a),city:userLocation.name,price:18+Math.floor(Math.random()*26),tags:tags[i%4],emoji:'🌾',id:`gen-${i}`}})}function update(){let pool=stores.map((s,i)=>({name:s[0],lat:s[1],lon:s[2],city:s[3],price:s[4],tags:s[5],emoji:s[6],id:`static-${i}`}));if(!pool.some(s=>distance(userLocation.lat,userLocation.lon,s.lat,s.lon)<=currentRadius)&&userLocation.name!=='France Métropolitaine')pool=fallback();activeStores=pool.map(s=>({...s,distance:distance(userLocation.lat,userLocation.lon,s.lat,s.lon)})).filter(s=>s.price<=currentMaxBudget&&(currentRadius>=999||s.distance<=currentRadius)).sort((a,b)=>a.distance-b.distance);render()}function render(){activeMarkers.forEach(m=>map.removeLayer(m));activeMarkers.clear();document.getElementById('resultsCount').textContent=`${activeStores.length} trouvé${activeStores.length>1?'s':''}`;document.getElementById('cardsList').innerHTML=activeStores.length?activeStores.map(s=>`<div class="store-card" id="card-${s.id}" onclick="window.selectAndFocus('${s.id}')"><div class="store-avatar">${s.emoji}</div><div class="store-info"><h3>${s.name}</h3><div class="store-sub">📍 ${s.city} · ${s.distance.toFixed(1)} km</div><div class="tag-row">${s.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div></div><div class="store-right"><div class="price-tag">${s.price} €</div><div class="open-badge">● Ouvert</div></div></div>`).join(''):'<div class="empty-state">🌾<br><strong>Aucun producteur trouvé</strong><br>Élargissez le rayon ou le budget maximum.</div>';activeStores.forEach(s=>{let m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="pin-pill" id="pin-${s.id}">${s.emoji} ${s.price} €</div>`,iconSize:[70,30],iconAnchor:[35,15]})}).addTo(map);m.on('click',()=>window.selectAndFocus(s.id,true));activeMarkers.set(s.id,m)})}window.selectAndFocus=(id,fromMarker=false)=>{let s=activeStores.find(x=>x.id===id);if(!s)return;document.querySelectorAll('.store-card,.pin-pill').forEach(x=>x.classList.remove('active'));document.getElementById(`card-${id}`)?.classList.add('active');document.getElementById(`pin-${id}`)?.classList.add('active');document.getElementById(`card-${id}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});if(!fromMarker)map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),13),{duration:.8});setTimeout(()=>openSheet(s),400)};function openSheet(s){document.getElementById('modalName').textContent=`${s.emoji} ${s.name}`;document.getElementById('modalDistance').textContent=`${s.city} — à ${s.distance.toFixed(1)} km (Panier moyen : ${s.price} €)`;document.getElementById('modalPills').innerHTML=s.tags.map(t=>`<span class="tag-pill" style="font-size:12px;padding:5px 9px">${t}</span>`).join('');document.getElementById('modalCall').href='tel:+33140000000';document.getElementById('modalOverlay').classList.add('open')}document.getElementById('closeModalBtn').onclick=()=>document.getElementById('modalOverlay').classList.remove('open');document.getElementById('modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')document.getElementById('modalOverlay').classList.remove('open')};document.getElementById('budgetSlider').oninput=e=>{currentMaxBudget=+e.target.value;document.getElementById('budgetValue').textContent=`${currentMaxBudget}${currentMaxBudget===100?'+':''} €`;update()};document.querySelectorAll('.segment-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segment-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentRadius=+b.dataset.radius;update()});const input=document.getElementById('searchInput'),menu=document.getElementById('suggestionsMenu');input.oninput=e=>{let q=e.target.value.trim();if(q.length<2)return menu.classList.remove('show');clearTimeout(searchDebounce);searchDebounce=setTimeout(async()=>{try{let d=await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&type=municipality&limit=4`).then(r=>r.json());menu.innerHTML=(d.features||[]).map(f=>{let[lon,lat]=f.geometry.coordinates;return`<button class="suggestion-item" data-lat="${lat}" data-lon="${lon}" data-name="${f.properties.name}">📍 <div><strong>${f.properties.name}</strong><small>${f.properties.context||''}</small></div></button>`}).join('')||'<div class="suggestion-item">Aucune commune</div>';menu.classList.add('show');document.querySelectorAll('.suggestion-item[data-lat]').forEach(b=>b.onclick=()=>choose(+b.dataset.lat,+b.dataset.lon,b.dataset.name))}catch{menu.classList.remove('show')}},150)};function choose(lat,lon,name){userLocation={lat,lon,name};input.value=name;menu.classList.remove('show');if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="pin-user"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);map.flyTo([lat,lon],12,{duration:1.2});update()}document.getElementById('locateBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>choose(p.coords.latitude,p.coords.longitude,'Ma Position'),()=>alert('Activez la géolocalisation pour naviguer autour de vous.'));document.addEventListener('click',e=>{if(!e.target.closest('.search-container'))menu.classList.remove('show')});setTimeout(()=>map.invalidateSize(),200);update()})();
</script></body></html>
