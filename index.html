<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FindEat — Primeurs & Producteurs Locaux</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#F2F2F7;--card:#FFFFFF;--surface:rgba(255,255,255,.85);--green:#1E3A2F;--green-accent:#2E7D32;--green-soft:#E8F0EA;--terracotta:#D3543A;--ink:#1C1C1E;--muted:#8E8E93;--line:rgba(60,60,67,.12);--shadow-sm:0 2px 8px rgba(0,0,0,.04);--shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 16px 36px rgba(30,58,47,.14);--radius-sm:12px;--radius-md:18px;--radius-lg:24px;--font-ios:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--font-ios);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}button,input{font-family:inherit;border:0;outline:0}button{cursor:pointer;transition:transform .15s ease}button:active{transform:scale(.97)}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);z-index:1000;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;min-width:220px}.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--green),#0F201A);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 10px rgba(30,58,47,.2)}.brand-text h1{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--green);line-height:1.1}.brand-text p{font-size:11px;color:var(--muted);font-weight:500}.search-wrapper{position:relative;flex:1;max-width:540px}.search-input{width:100%;height:44px;padding:0 40px 0 42px;background:rgba(118,118,128,.12);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);transition:all .2s ease}.search-input:focus{background:#fff;box-shadow:0 0 0 3px rgba(30,58,47,.15),var(--shadow-sm)}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}.locate-btn{height:42px;padding:0 16px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(30,58,47,.18)}.suggestions-dropdown{position:absolute;top:50px;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border-radius:var(--radius-md);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:1200}.suggestions-dropdown.open{display:block}.suggestion-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border-radius:10px;text-align:left;font-size:13px}.suggestion-item:hover{background:var(--green-soft)}.suggestion-item strong{display:block;color:var(--ink)}.suggestion-item small{color:var(--muted);font-size:11px}.app-layout{flex:1;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden;position:relative}#map-container{position:relative;width:100%;height:100%;background:#E5E3DF}#map{width:100%;height:100%}.sidebar{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}.filters-section{padding:16px 20px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);flex-shrink:0}.quick-cities{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}.city-chip{padding:5px 11px;border-radius:14px;background:rgba(118,118,128,.1);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}.city-chip.active,.city-chip:hover{background:var(--green);color:#fff}.shelf-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.shelf-header h2{font-size:16px;font-weight:700;letter-spacing:-.3px}.results-badge{font-size:12px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 9px;border-radius:12px}.budget-slider-box{margin-bottom:14px}.budget-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}.budget-labels span{color:var(--muted)}.budget-labels strong{color:var(--terracotta);font-size:14px}input[type=range]{-webkit-appearance:none;width:100%;background:transparent}input[type=range]::-webkit-slider-runnable-track{width:100%;height:6px;background:#E5E5EA;border-radius:3px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:24px;width:24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);margin-top:-9px;cursor:pointer}.segmented-control{display:flex;background:#E5E5EA;padding:2px;border-radius:10px}.segment-btn{flex:1;padding:7px 0;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border-radius:8px;text-align:center;transition:all .2s}.segment-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}.cards-flow{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.store-card{background:var(--card);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);border:1.5px solid transparent;transition:all .2s ease;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;cursor:pointer}.store-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}.store-card.selected{border-color:var(--green);box-shadow:var(--shadow-lg)}.store-avatar{width:52px;height:52px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;font-size:24px}.store-info h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}.store-sub{font-size:12px;color:var(--muted);margin-bottom:6px}.tags-container{display:flex;flex-wrap:wrap;gap:4px}.tag-badge{font-size:10px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 6px;border-radius:6px}.store-pricing{text-align:right}.price-value{font-size:14px;font-weight:800;color:var(--terracotta)}.open-status{font-size:10px;font-weight:700;color:var(--green-accent);margin-top:4px}.pin-badge{background:#fff;color:var(--ink);font-weight:700;font-size:12px;padding:5px 9px;border-radius:14px;border:1.5px solid rgba(0,0,0,.08);box-shadow:0 4px 10px rgba(0,0,0,.15);white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .2s ease}.pin-badge:hover,.pin-badge.active{background:var(--green);color:#fff;transform:scale(1.12);box-shadow:0 8px 18px rgba(30,58,47,.35);z-index:9999!important}.pin-user{width:18px;height:18px;background:#007AFF;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(0,122,255,.25)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);z-index:2000;display:none;place-items:center;padding:18px}.modal-overlay.show{display:grid}.modal-card{width:100%;max-width:500px;background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.2);position:relative}.close-btn{position:absolute;top:18px;right:18px;width:32px;height:32px;background:#E5E5EA;border-radius:50%;font-size:16px;display:grid;place-items:center;color:var(--muted)}.hours-table{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin:14px 0;padding:12px;background:var(--bg);border-radius:var(--radius-sm)}.empty-state{padding:36px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.reset-btn{margin-top:10px;padding:8px 16px;background:var(--green);color:#fff;border-radius:10px;font-size:12px;font-weight:600}@media(max-width:860px){body{height:100%;overflow:auto}.app-layout{display:flex;flex-direction:column;height:auto}#map-container{height:46vh;min-height:280px}.sidebar{height:54vh;border-left:none}.topbar{padding:0 16px}.brand-text p{display:none}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-icon">🍏</div><div class="brand-text"><h1>FindEat</h1><p>Trouvez votre primeur en un clin d’œil !</p></div></div><div class="search-wrapper"><span class="search-icon">🔍</span><input id="searchInput" class="search-input" type="text" placeholder="Rechercher une ville en France (ex. Lyon, Bordeaux...)" autocomplete="off"><div id="suggestionsBox" class="suggestions-dropdown"></div></div><button id="locateBtn" class="locate-btn"><span>📍</span> Me localiser</button></header>
<main class="app-layout"><div id="map-container"><div id="map"></div></div><aside class="sidebar"><div class="filters-section"><div class="quick-cities"><button class="city-chip active" onclick="window.loadCity(48.8566,2.3522,'Paris',this)">📍 Paris</button><button class="city-chip" onclick="window.loadCity(45.764,4.8357,'Lyon',this)">📍 Lyon</button><button class="city-chip" onclick="window.loadCity(44.8378,-.5792,'Bordeaux',this)">📍 Bordeaux</button><button class="city-chip" onclick="window.loadCity(43.2965,5.3698,'Marseille',this)">📍 Marseille</button><button class="city-chip" onclick="window.loadCity(47.2184,-1.5536,'Nantes',this)">📍 Nantes</button><button class="city-chip" onclick="window.loadCity(50.6292,3.0573,'Lille',this)">📍 Lille</button></div><div class="shelf-header"><h2>Producteurs aux alentours</h2><span id="resultsCount" class="results-badge">Chargement...</span></div><div class="budget-slider-box"><div class="budget-labels"><span>Budget max (panier moyen)</span><strong id="budgetValue">50 €</strong></div><input id="budgetSlider" type="range" min="10" max="100" value="50" step="5"></div><div class="segmented-control" id="radiusButtons"><button class="segment-btn active" data-radius="5">5 km</button><button class="segment-btn" data-radius="10">10 km</button><button class="segment-btn" data-radius="15">15 km</button><button class="segment-btn" data-radius="20">20 km</button><button class="segment-btn" data-radius="999">Tout</button></div></div><div id="cardsList" class="cards-flow"></div></aside></main>
<div id="modalOverlay" class="modal-overlay"><div class="modal-card"><button id="closeModal" class="close-btn">✕</button><h2 id="modalTitle" style="font-size:19px;font-weight:700;color:var(--green);margin-bottom:4px"></h2><p id="modalSub" style="font-size:13px;color:var(--muted);margin-bottom:12px"></p><div style="font-size:13px;font-weight:600">Horaires d'ouverture</div><div class="hours-table"><div><strong>Lundi - Vendredi</strong></div><div>08:30 – 19:30</div><div><strong>Samedi</strong></div><div>08:00 – 18:00</div><div><strong>Dimanche</strong></div><div>09:00 – 13:00</div></div><div style="font-size:13px;font-weight:600;margin-bottom:8px">Arrivages de saison</div><div id="modalTags" class="tags-container" style="margin-bottom:20px"></div><a id="modalTel" href="tel:+33140000000" style="display:block;text-align:center;background:var(--green);color:#fff;padding:12px;border-radius:12px;font-weight:600;text-decoration:none;font-size:14px">📞 Contacter le producteur</a></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{let activeLocation={lat:48.8566,lon:2.3522,name:'Paris'},selectedRadius=5,selectedMaxBudget=50,markersRegistry=new Map,currentStores=[],searchTimeout=null,userLocationMarker=null;const storeCatalog=[{id:'p1',name:'Le Potager Maraîcher',lat:48.859,lon:2.348,city:'Paris 1er',price:28,tags:['Pommes bio','Carottes','Fraises'],emoji:'🍎'},{id:'p2',name:'Au Panier de saison',lat:48.843,lon:2.371,city:'Paris 12e',price:22,tags:['Salades','Radis','Légumes racines'],emoji:'🥬'},{id:'p3',name:'La Récolte des Buttes',lat:48.879,lon:2.382,city:'Paris 19e',price:34,tags:['Paniers bio','Poires','Miel local'],emoji:'🍐'},{id:'p4',name:'Les Vergers de Saint-Germain',lat:48.851,lon:2.332,city:'Paris 6e',price:42,tags:['Agrumes','Champignons','Herbes'],emoji:'🍊'},{id:'p5',name:'La Ferme Montmartre',lat:48.889,lon:2.342,city:'Paris 18e',price:29,tags:['Tomates cerises','Courgettes'],emoji:'🍅'},{id:'p6',name:'Jardins de Belleville',lat:48.871,lon:2.389,city:'Paris 20e',price:19,tags:['Blettes','Courges','Épinards'],emoji:'🥦'},{id:'ly1',name:"Le Maraîcher de la Presqu'île",lat:45.761,lon:4.834,city:'Lyon 2e',price:24,tags:['Tomates anciennes','Basilic','Pêches'],emoji:'🍅'},{id:'ly2',name:"La Source des Monts d'Or",lat:45.782,lon:4.819,city:'Lyon 9e',price:31,tags:['Fromage fermier','Miel','Poires'],emoji:'🧀'},{id:'ly3',name:'Les Jardins du Rhône',lat:45.748,lon:4.845,city:'Lyon 7e',price:20,tags:['Salades','Légumes d’antan'],emoji:'🥬'},{id:'bx1',name:'Les Maraîchers de Garonne',lat:44.841,lon:-.574,city:'Bordeaux Centre',price:26,tags:['Asperges','Cèpes','Fraises'],emoji:'🍓'},{id:'bx2',name:'Le Marché des Capucins',lat:44.831,lon:-.568,city:'Bordeaux Sud',price:21,tags:['Raisins','Légumes bio','Prunes'],emoji:'🍇'},{id:'mrs1',name:'Terre de Provence',lat:43.297,lon:5.372,city:'Marseille Vieux-Port',price:25,tags:['Melons','Courgettes','Figues'],emoji:'🍈'},{id:'mrs2',name:'Les Oliviers du Prado',lat:43.272,lon:5.385,city:'Marseille 8e',price:35,tags:["Huile d'olive",'Tomates','Blettes'],emoji:'🫒'},{id:'nt1',name:'Le Potager Nantais',lat:47.217,lon:-1.554,city:'Nantes Centre',price:22,tags:['Mâche nantaise','Poireaux','Fraises'],emoji:'🥬'},{id:'nt2',name:"Ferme de l'Erdre",lat:47.242,lon:-1.532,city:'Nantes Nord',price:27,tags:['Carottes de sable','Paniers'],emoji:'🥕'},{id:'lil1',name:'Les Vergers des Flandres',lat:50.635,lon:3.061,city:'Lille Centre',price:24,tags:['Chicons','Pommes régionales'],emoji:'🍏'},{id:'lil2',name:'Ferme du Wambrechies',lat:50.655,lon:3.048,city:'Lille Métropole',price:18,tags:['Poireaux','Choux','Pommes de terre'],emoji:'🥔'}];const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([activeLocation.lat,activeLocation.lon],13);const googleTiles=L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['0','1','2','3']}).addTo(map);let fallbackLayer;googleTiles.on('tileerror',()=>{if(!fallbackLayer)fallbackLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}').addTo(map)});L.control.zoom({position:'bottomright'}).addTo(map);const calc=(a,b,c,d)=>{let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,z=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 6371*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};function fallback(loc){let names=['Ferme du Terroir','Au Panier Frais','Le Potager Local','Les Maraîchers Bio','La Grange Champêtre'],tags=[['Pommes','Carottes','Miel'],['Salades','Tomates','Poireaux'],['Fraises','Radis','Courgettes']];return Array.from({length:5},(_,i)=>{let a=Math.random()*Math.PI*2,d=1.2+Math.random()*4.5;return{id:`gen-${i}-${Date.now()}`,name:`${names[i%names.length]} de ${loc.name}`,lat:loc.lat+d/111*Math.cos(a),lon:loc.lon+d/(111*Math.cos(loc.lat*Math.PI/180))*Math.sin(a),city:loc.name,price:18+Math.floor(Math.random()*26),tags:tags[i%tags.length],emoji:'🌾'}})}function refresh(){let pool=storeCatalog.map(s=>({...s,distance:calc(activeLocation.lat,activeLocation.lon,s.lat,s.lon)}));if(!pool.some(s=>s.distance<=selectedRadius))pool=fallback(activeLocation).map(s=>({...s,distance:calc(activeLocation.lat,activeLocation.lon,s.lat,s.lon)}));currentStores=pool.filter(s=>s.price<=selectedMaxBudget&&(selectedRadius>=999||s.distance<=selectedRadius)).sort((a,b)=>a.distance-b.distance);render()}function render(){markersRegistry.forEach(m=>map.removeLayer(m));markersRegistry.clear();document.getElementById('resultsCount').textContent=`${currentStores.length} trouvé${currentStores.length>1?'s':''}`;const list=document.getElementById('cardsList');list.innerHTML=currentStores.length?currentStores.map(s=>`<div class="store-card" id="card-${s.id}" onclick="window.selectProducer('${s.id}')"><div class="store-avatar">${s.emoji}</div><div class="store-info"><h3>${s.name}</h3><div class="store-sub">📍 ${s.city} · à ${s.distance.toFixed(1)} km</div><div class="tags-container">${s.tags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div></div><div class="store-pricing"><div class="price-value">${s.price} €</div><div class="open-status">● Ouvert</div></div></div>`).join(''):'<div class="empty-state">🌾<br><strong>Aucun primeur à ces conditions</strong><br>Augmentez le rayon ou le budget.<br><button class="reset-btn" onclick="window.resetFilters()">Réinitialiser les filtres</button></div>';currentStores.forEach(s=>{let marker=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="pin-badge" id="pin-${s.id}">${s.emoji} ${s.price} €</div>`,iconSize:[60,30],iconAnchor:[30,15]})}).addTo(map);marker.on('click',()=>window.selectProducer(s.id,true));markersRegistry.set(s.id,marker)});if(userLocationMarker)map.removeLayer(userLocationMarker);userLocationMarker=L.marker([activeLocation.lat,activeLocation.lon],{icon:L.divIcon({className:'',html:'<div class="pin-user"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map)}window.selectProducer=(id,fromMarker=false)=>{let s=currentStores.find(x=>x.id===id);if(!s)return;document.querySelectorAll('.store-card,.pin-badge').forEach(x=>x.classList.remove('selected','active'));document.getElementById(`card-${id}`)?.classList.add('selected');document.getElementById(`pin-${id}`)?.classList.add('active');document.getElementById(`card-${id}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});if(!fromMarker)map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),13),{duration:.8});setTimeout(()=>{document.getElementById('modalTitle').textContent=`${s.emoji} ${s.name}`;document.getElementById('modalSub').textContent=`${s.city} — à ${s.distance.toFixed(1)} km · Panier moyen : ${s.price} €`;document.getElementById('modalTags').innerHTML=s.tags.map(t=>`<span class="tag-badge" style="font-size:12px;padding:5px 9px">${t}</span>`).join('');document.getElementById('modalOverlay').classList.add('show')},350)};window.loadCity=(lat,lon,name,btn)=>{document.querySelectorAll('.city-chip').forEach(c=>c.classList.remove('active'));if(btn)btn.classList.add('active');activeLocation={lat,lon,name};document.getElementById('searchInput').value=name;map.flyTo([lat,lon],13,{duration:1.2});refresh()};window.resetFilters=()=>{selectedMaxBudget=100;selectedRadius=999;document.getElementById('budgetSlider').value=100;document.getElementById('budgetValue').textContent='100+ €';document.querySelectorAll('.segment-btn').forEach(b=>b.classList.remove('active'));document.querySelector('[data-radius="999"]').classList.add('active');refresh()};document.getElementById('closeModal').onclick=()=>document.getElementById('modalOverlay').classList.remove('show');document.getElementById('modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')document.getElementById('modalOverlay').classList.remove('show')};document.getElementById('budgetSlider').oninput=e=>{selectedMaxBudget=+e.target.value;document.getElementById('budgetValue').textContent=`${selectedMaxBudget}${selectedMaxBudget===100?'+':''} €`;refresh()};document.querySelectorAll('.segment-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.segment-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedRadius=+btn.dataset.radius;refresh()});const input=document.getElementById('searchInput'),dropdown=document.getElementById('suggestionsBox');input.oninput=e=>{let q=e.target.value.trim();if(q.length<2)return dropdown.classList.remove('open');clearTimeout(searchTimeout);searchTimeout=setTimeout(async()=>{try{let data=await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&type=municipality&limit=4`).then(r=>r.json());dropdown.innerHTML=(data.features||[]).map(f=>{let[lon,lat]=f.geometry.coordinates;return`<button class="suggestion-item" data-lat="${lat}" data-lon="${lon}" data-name="${f.properties.name}"><span>📍</span><div><strong>${f.properties.name}</strong><small>${f.properties.context||''}</small></div></button>`}).join('')||'<div class="suggestion-item">Aucune commune</div>';dropdown.classList.add('open');document.querySelectorAll('.suggestion-item[data-lat]').forEach(b=>b.onclick=()=>{window.loadCity(+b.dataset.lat,+b.dataset.lon,b.dataset.name,null);dropdown.classList.remove('open')})}catch{dropdown.classList.remove('open')}},150)};document.getElementById('locateBtn').onclick=()=>{if(!navigator.geolocation)return alert('Géolocalisation non supportée.');navigator.geolocation.getCurrentPosition(p=>window.loadCity(p.coords.latitude,p.coords.longitude,'Ma Position',null),()=>alert("Activez l'accès GPS dans votre navigateur."))};document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))dropdown.classList.remove('open')});setTimeout(()=>map.invalidateSize(),200);refresh()})();
</script>
</body>
</html>
